name: Area 33 draft website validation
on:
  push:
    branches: [site-refresh-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test approval gating and public-field allowlists
        run: python -m unittest discover -s scripts -p "test_publish_public_directories.py" -v
      - name: Check JavaScript syntax
        run: |
          node --check assets/public-directories.js
          node --check assets/catalog.js
          node --check assets/experience-lab.js
      - name: Test the public website contract
        run: node scripts/test_public_site.mjs
