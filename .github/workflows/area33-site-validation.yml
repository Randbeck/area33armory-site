name: Area 33 draft website validation
on:
  push:
    branches: [site-refresh-v1, work/approved-catalog-thumbnails, work/randbeck-catalog-bridge-v1, work/scalable-approved-catalog-v2, work/distributor-scope-authorization-v1, work/rights-safe-text-catalog-v1, work/private-media-withdrawal-v1, work/approved-catalog-release-preflight-v1, work/controlled-catalog-release-v1, work/github-pages-controlled-publish-v1, work/private-text-batch-review-v1, work/private-evidence-assisted-review-v1, work/referenced-product-research-v1, work/first-catalog-readiness-v1, work/storefront-approved-image-zoom-v1, work/experience-bay-discovery-v1, work/real-product-showroom-v2, work/flagship-real-photo-viewer-v1, work/verified-pairing-experience-v1, work/interactive-real-product-bench-v1, work/immersive-licensed-photo-showroom-v1, work/area33-six-view-counter-v1, work/area33-intelligent-storefront-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install photo intake test dependency
        run: python -m pip install "Pillow>=11,<13"
      - name: Test privacy, photo intake and exact-media publisher
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check JavaScript syntax
        run: |
          node --check assets/public-directories.js
          node --check assets/portfolio-compare.js
          node --input-type=module --check < assets/catalog.js
          node --check assets/catalog-gallery.mjs
          node --check assets/product-room-research.mjs
          node --check assets/six-view-contract.mjs
          node --check assets/customer-experience.mjs
          node --check assets/featured-opportunities.mjs
          node --input-type=module --check < assets/featured-opportunities-ui.js
          node --input-type=module --check < assets/customer-experience-ui.js
          node --input-type=module --check < assets/six-view-counter.js
          node --check assets/accessory-context.mjs
          node --check assets/research-photo-license.mjs
          node --check assets/pairing-evidence.mjs
          node --check assets/showroom-inspiration.mjs
          node --check assets/experience-bench.mjs
          node --check assets/real-photo-theater.mjs
          node --check assets/research-photo-viewer.mjs
          node --input-type=module --check < assets/product-room.js
          node --check assets/catalog-static-contract.mjs
          node --check assets/catalog-shards-contract.mjs
          node --check assets/experience-lab.js
          node --check assets/showroom-contract.mjs
          node --input-type=module --check < assets/showroom.js
      - name: Validate test public site
        run: node scripts/test_public_site.mjs
      - name: Validate test showroom contract
        run: node scripts/test_showroom_contract.mjs
      - name: Validate test catalog static contract
        run: node scripts/test_catalog_static_contract.mjs
      - name: Validate test catalog gallery contract
        run: node scripts/test_catalog_gallery_contract.mjs
      - name: Validate test experience bay
        run: node scripts/test_experience_bay.mjs
      - name: Validate approved featured opportunities
        run: node scripts/test_featured_opportunities.mjs
      - name: Validate integrated intelligent customer storefront
        run: node scripts/test_customer_experience.mjs
      - name: Validate six-view product counter
        run: node scripts/test_six_view_counter.mjs
      - name: Validate test product room
        run: node scripts/test_product_room.mjs
      - name: Validate context-aware accessories
        run: node scripts/test_accessory_context.mjs
      - name: Validate test flagship research photo
        run: node scripts/test_flagship_research_photo.mjs
      - name: Validate test pairing evidence
        run: node scripts/test_pairing_evidence.mjs
      - name: Validate test experience bench
        run: node scripts/test_experience_bench.mjs
      - name: Validate test immersive photo theater
        run: node scripts/test_immersive_photo_theater.mjs
      - name: Validate test catalog shards contract
        run: node scripts/test_catalog_shards_contract.mjs
