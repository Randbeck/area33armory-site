name: Area 33 draft website validation
on:
  push:
    branches: [site-refresh-v1, work/approved-catalog-thumbnails, work/randbeck-catalog-bridge-v1, work/scalable-approved-catalog-v2, work/distributor-scope-authorization-v1, work/rights-safe-text-catalog-v1, work/private-media-withdrawal-v1, work/approved-catalog-release-preflight-v1, work/controlled-catalog-release-v1, work/github-pages-controlled-publish-v1, work/private-text-batch-review-v1, work/private-evidence-assisted-review-v1, work/referenced-product-research-v1, work/first-catalog-readiness-v1, work/storefront-approved-image-zoom-v1, work/experience-bay-discovery-v1, work/real-product-showroom-v2, work/flagship-real-photo-viewer-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install photo intake test dependency
        run: python -m pip install "Pillow>=11,<13"
      - name: Test privacy, photo intake and exact-media publisher
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Check JavaScript syntax
        run: |
          node --check assets/public-directories.js
          node --check assets/portfolio-compare.js
          node --input-type=module --check < assets/catalog.js
          node --check assets/catalog-gallery.mjs
          node --check assets/product-room-research.mjs
          node --check assets/research-photo-license.mjs
          node --check assets/research-photo-viewer.mjs
          node --input-type=module --check < assets/product-room.js
          node --check assets/catalog-static-contract.mjs
          node --check assets/catalog-shards-contract.mjs
          node --check assets/experience-lab.js
          node --check assets/showroom-contract.mjs
          node --input-type=module --check < assets/showroom.js
      - name: Test public website contract
        run: |
          node scripts/test_public_site.mjs
          node scripts/test_showroom_contract.mjs
          node scripts/test_catalog_static_contract.mjs
          node scripts/test_catalog_gallery_contract.mjs
          node scripts/test_experience_bay.mjs
          node scripts/test_product_room.mjs
          node scripts/test_flagship_research_photo.mjs
          node scripts/test_catalog_shards_contract.mjs
