<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Area 33 Armory | Under Construction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0b0b;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .container {
      max-width: 800px;
    }

    h1 {
      font-size: clamp(2.7rem, 8vw, 5.5rem);
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .line {
      width: 90px;
      height: 3px;
      background: #8b0000;
      margin: 25px auto;
    }

    h2 {
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      letter-spacing: 5px;
      font-weight: 400;
      margin-bottom: 25px;
    }

    p {
      color: #bdbdbd;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .slogan {
      margin-top: 35px;
      font-size: 0.95rem;
      letter-spacing: 2px;
      color: #888888;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AREA 33 ARMORY</h1>

    <div class="line"></div>

    <h2>UNDER CONSTRUCTION</h2>

    <p>
      We're rebuilding our website.<br>
      Please check back soon.
    </p>

    <div class="slogan">
      Equipping Patriots • Supporting Heroes
    </div>
  </div>
</body>
</html>
